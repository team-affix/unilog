name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: editors/vscode
      - run: npx tsc -p tsconfig.json
        working-directory: editors/vscode
      - run: npm run build
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode
      - run: npx vsce package --no-dependencies --out unilog-vscode-preview.vsix
        working-directory: editors/vscode
      # Keep the built extension, so any PR or branch can be tried without a release: on the run's page,
      # under Artifacts, download unilog-vscode-preview (a zip containing the .vsix).
      - uses: actions/upload-artifact@v4
        with:
          name: unilog-vscode-preview
          path: editors/vscode/unilog-vscode-preview.vsix
          retention-days: 30

  # Publishes a GitHub Release with the CLI, the language server and the VS Code extension, after every
  # test job passes. Runs when:
  # - main is pushed (e.g. a PR is merged) and its package version has no release yet: tags that commit
  #   v<version> and releases it. If that version is already released, it does nothing.
  # - a v* tag is pushed by hand: releases that tag, if it matches the package version.
  # Nothing built is committed to the repo.
  release:
    needs: [test, vscode-extension]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Decide whether to release
        id: decide
        run: |
          cli=$(node -p "require('./package.json').version")
          ext=$(node -p "require('./editors/vscode/package.json').version")
          if [ "$cli" != "$ext" ]; then
            echo "::error::package.json ($cli) and editors/vscode/package.json ($ext) must have the same version."
            exit 1
          fi
          echo "VERSION=$cli" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$cli" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the package version $cli."
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$cli" > /dev/null; then
            echo "v$cli is already released; nothing to do. Bump the version to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$cli has no release yet: releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the CLI and language server as single files
        if: steps.decide.outputs.release == 'true'
        run: |
          npm ci
          npm run bundle
          mkdir -p dist-release
          cp release/unilog.cjs "dist-release/unilog-$VERSION.cjs"
          cp release/unilog-lsp.cjs "dist-release/unilog-lsp-$VERSION.cjs"
          node "dist-release/unilog-$VERSION.cjs" --version

      - name: Build the npm package
        if: steps.decide.outputs.release == 'true'
        run: |
          npm run build
          npm pack --pack-destination dist-release

      - name: Build the VS Code extension
        if: steps.decide.outputs.release == 'true'
        working-directory: editors/vscode
        run: |
          npm ci
          npm run build
          npx vsce package --no-dependencies --out "../../dist-release/unilog-vscode-$VERSION.vsix"

      - name: Create the GitHub Release
        if: steps.decide.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist-release/*
